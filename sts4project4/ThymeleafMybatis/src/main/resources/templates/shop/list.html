<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
layout:decorate="~{layout/layoutMain}">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Dongle&family=Gaegu&family=Hi+Melody&family=Nanum+Myeongjo&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<script src="https://code.jquery.com/jquery-3.7.1.js"></script>
<title>Insert title here</title>
</head>
<body>
<div layout:fragment="content">
   
    <h5>총 [[${totalCount}]] 개의 상품이 있습니다</h5>
    <button type="button" class="btn btn-secondary"
    onclick="location.href='addform'">상품추가</button>
    <br><br>
    <table class="table table-bordered" style="width: 700px;">
       <tr class="table-success">
          <th width="100">번호</th>
          <th width="200">상품명</th>
          <th width="200">가격</th>
          <th width="200">입고날짜</th>
       </tr>
       
       <tr th:each="dto,iter:${list}">
          <td>[[${iter.count}]]</td>
          <td>
            <a>[[${dto.sangpum}]]</a>
          </td>
          <td align="right">
            <span th:text="${#numbers.formatInteger(dto.price,0,'COMMA')}"></span>
          </td>
          <td align="center">
             [[${dto.ipgoday}]]
          </td>
       </tr>
    </table>
</div>
</body>
</html>
