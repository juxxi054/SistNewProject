<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Dongle&family=Gaegu&family=Hi+Melody&family=Nanum+Myeongjo&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
<script src="https://code.jquery.com/jquery-3.7.1.js"></script>
<title>Insert title here</title>
</head>
<body>
  <div style="margin: 100px 100px;" th:object="${dto}">
     <h3 class="alert alert-info">[[${dto.sangpum}]]  상세보기</h3>
     <br>
     <h4>원본사진</h4>
     <img th:src="@{|/save/${dto.photo}|}" style="width: 200px;">
      <h5>상품명: [[*{sangpum}]]</h5>
      <div  th:style="'background-color:'+*{color}">
        색상: [[*{color}]]
      </div>
      <h5>가격: [[*{price}]]</h5>
      <h5>날짜: [[*{ipgoday}]]</h5>
      <h5>등록일: 
         <span th:text="${#calendars.format(dto.wrteday,'yyyy-MM-dd HH:mm')}"></span>
      </h5>
      
      
      <br>
      <button type="button" class="btn btn-outline-primary"
      onclick="location.href='list'">목록</button>
      <button type="button" class="btn btn-outline-primary"
      onclick="location.href='./addform'">상품등록</button>
      <button type="button" class="btn btn-outline-primary"
      th:onclick="|location.href='@{./delete(num=${dto.num})}'|">삭제</button>
  </div>
</body>
</html>
